apiVersion: v1
kind: ConfigMap
metadata:
  name: educrm-config
  namespace: educrm-production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "educrm_prod"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  API_GATEWAY_URL: "http://api-gateway:3000"
  GRAPHQL_GATEWAY_URL: "http://graphql-gateway:4000"
  ENABLE_FILE_LOGS: "true"
  LOG_DIR: "/var/log/educrm"
  CACHE_TTL_SECONDS: "300"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: educrm-config
  namespace: educrm-staging
data:
  NODE_ENV: "staging"
  LOG_LEVEL: "debug"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "educrm_staging"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  API_GATEWAY_URL: "http://api-gateway:3000"
  GRAPHQL_GATEWAY_URL: "http://graphql-gateway:4000"
  ENABLE_FILE_LOGS: "true"
  LOG_DIR: "/var/log/educrm"
  CACHE_TTL_SECONDS: "300"
