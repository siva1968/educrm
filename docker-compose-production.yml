    container_name: educrm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - graphql-gateway
      - student-information-service
    networks:
      - educrm-network
    restart: unless-stopped

# =========================================
# VOLUMES
# =========================================

volumes:
  postgres_data:
