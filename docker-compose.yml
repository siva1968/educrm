version: '3.8'

# ==================================================================================================
# EduCRM - Complete Microservices Stack
# ==================================================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: educrm-postgres
    environment:
      POSTGRES_DB: educrm_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educrm-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: educrm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - educrm-network

networks:
  educrm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
