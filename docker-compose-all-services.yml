version: '3.8'

services:
  # =========================================
  # INFRASTRUCTURE SERVICES
  # =========================================

  postgres:
    image: postgres:15-alpine
    container_name: educrm-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-educrm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educrm-network

  redis:
    image: redis:7-alpine
    container_name: educrm-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - educrm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: educrm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - educrm-network

  grafana:
    image: grafana/grafana:latest
    container_name: educrm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - educrm-network

  # =========================================
  # STUDENT MANAGEMENT SERVICES (4100-4105)
  # =========================================

  student-information-service:
    build:
      context: ./backend/services/student-information-service
      dockerfile: Dockerfile
    container_name: student-information-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - SIS_PORT=4100
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-educrm}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - CACHE_ENABLED=true
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - educrm-network
    restart: unless-stopped

  attendance-management-service:
    build:
      context: ./backend/services/attendance-management-service
      dockerfile: Dockerfile
    container_name: attendance-management-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - ATTENDANCE_PORT=4101
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "4101:4101"
    depends_on:
      - postgres
      - redis
    networks:
      - educrm-network
    restart: unless-stopped

  fee-management-service:
    build:
      context: ./backend/services/fee-management-service
      dockerfile: Dockerfile
    container_name: fee-management-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - FEE_MANAGEMENT_PORT=4140
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "4140:4140"
    depends_on:
      - postgres
      - redis
    networks:
      - educrm-network
    restart: unless-stopped

  # =========================================
  # AI & FOUNDATION SERVICES (4000-4013)
  # =========================================

  graphql-gateway:
    build:
      context: ./backend/services/graphql-gateway
      dockerfile: Dockerfile
    container_name: graphql-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - GRAPHQL_GATEWAY_PORT=4000
    ports:
      - "4000:4000"
    networks:
      - educrm-network
    restart: unless-stopped

  nlp-service:
    build:
      context: ./backend/services/nlp-service
      dockerfile: Dockerfile
    container_name: nlp-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NLP_SERVICE_PORT=4001
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - redis
    networks:
      - educrm-network
    restart: unless-stopped

  payment-gateway:
    build:
      context: ./backend/services/payment-gateway
      dockerfile: Dockerfile
    container_name: payment-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PAYMENT_GATEWAY_PORT=4004
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    ports:
      - "4004:4004"
    networks:
      - educrm-network
    restart: unless-stopped
    secrets:
      - razorpay_secret
      - stripe_secret

  # =========================================
  # NGINX REVERSE PROXY
  # =========================================

  nginx:
    image: nginx:alpine
    container_name: educrm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - graphql-gateway
      - student-information-service
      - fee-management-service
    networks:
      - educrm-network
    restart: unless-stopped

# =========================================
# VOLUMES
# =========================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# =========================================
# NETWORKS
# =========================================

networks:
  educrm-network:
    driver: bridge

# =========================================
# SECRETS (for production)
# =========================================

secrets:
  razorpay_secret:
    file: ./secrets/razorpay_secret.txt
  stripe_secret:
    file: ./secrets/stripe_secret.txt
